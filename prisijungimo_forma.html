<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prisijungimo forma</title>
  </head>
  <body>
    <main>
      <style>
  main {
    width: 80%;
    margin: auto;
  }
  form {
    display: grid;
    grid-template-columns: 150px 200px;
    gap: 10px;
    align-items: center;
  }
  .full-width {
    grid-column: 1 / -1;
  }
</style>

<h2>Prisijungimo forma</h2>
<form action="#" method="post">
  <label for="username">Vartotojo vardas:</label>
  <input type="text" id="username" name="username" placeholder="Vartotojo vardas" required />

  <label for="password">Slaptažodis:</label>
  <input type="password" id="password" name="password" placeholder="Slaptažodis" required />

  <input type="submit" value="Prisijungti" class="full-width" />
</form>



  </body>
</html>
